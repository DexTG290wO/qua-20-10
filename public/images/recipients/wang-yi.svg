<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E1" />
      <stop offset="50%" stop-color="#FFD1DC" />
      <stop offset="100%" stop-color="#E6E6FA" />
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFF9C4" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" rx="24" fill="url(#bgGrad)" />

  <!-- Soft Golden Aura -->
  <circle cx="200" cy="220" r="160" fill="url(#auraGrad)" />

  <!-- Crescent Moon Symbol in Background -->
  <path d="M 280,100 A 70,70 0 1,1 190,190 A 55,55 0 1,0 280,100 Z" fill="#FFE082" opacity="0.6" filter="url(#softGlow)" />

  <!-- Cute Chibi Girl Portrait Art -->
  <!-- Long Flowing Hair (Back) -->
  <path d="M 120,200 C 100,280 90,360 110,420 C 130,380 150,300 160,260 Z" fill="#4A3B32" />
  <path d="M 280,200 C 300,280 310,360 290,420 C 270,380 250,300 240,260 Z" fill="#4A3B32" />

  <!-- White Pastel Dress -->
  <path d="M 140,360 Q 200,340 260,360 L 290,500 L 110,500 Z" fill="#FFF0F5" opacity="0.95" />
  <!-- Lace Collar -->
  <path d="M 160,360 Q 200,380 240,360 Q 200,350 160,360 Z" fill="#F8BBD0" />

  <!-- Face -->
  <ellipse cx="200" cy="240" rx="65" ry="68" fill="#FFF5EB" />

  <!-- Rosy Blushing Cheeks -->
  <circle cx="155" cy="265" r="14" fill="#FF80AB" opacity="0.55" filter="url(#softGlow)" />
  <circle cx="245" cy="265" r="14" fill="#FF80AB" opacity="0.55" filter="url(#softGlow)" />

  <!-- Kawaii Anime Eyes -->
  <ellipse cx="165" cy="235" rx="12" ry="15" fill="#2E1C0C" />
  <circle cx="162" cy="230" r="4.5" fill="#FFFFFF" />
  <circle cx="168" cy="240" r="2" fill="#FFFFFF" />

  <ellipse cx="235" cy="235" rx="12" ry="15" fill="#2E1C0C" />
  <circle cx="232" cy="230" r="4.5" fill="#FFFFFF" />
  <circle cx="238" cy="240" r="2" fill="#FFFFFF" />

  <!-- Cute Sweet Smile -->
  <path d="M 193,272 Q 200,280 207,272" stroke="#D81B60" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Hair Bangs & Front Strands -->
  <path d="M 135,210 Q 170,170 200,170 Q 230,170 265,210 Q 250,225 235,210 Q 200,220 165,210 Z" fill="#4A3B32" />
  <path d="M 140,210 Q 130,270 145,310 Q 155,270 150,225 Z" fill="#4A3B32" />
  <path d="M 260,210 Q 270,270 255,310 Q 245,270 250,225 Z" fill="#4A3B32" />

  <!-- Flower Wreath & Bunny Ears Headband -->
  <!-- Left Ear -->
  <path d="M 155,165 C 140,110 135,80 150,60 C 165,80 165,110 165,160 Z" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="2" />
  <path d="M 153,150 C 145,115 142,95 150,80 C 158,95 158,115 158,145 Z" fill="#FCE4EC" />
  <!-- Right Ear -->
  <path d="M 245,165 C 260,110 265,80 250,60 C 235,80 235,110 235,160 Z" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="2" />
  <path d="M 247,150 C 255,115 258,95 250,80 C 242,95 242,115 242,145 Z" fill="#FCE4EC" />

  <!-- Floral Blossoms on Headband -->
  <circle cx="200" cy="165" r="9" fill="#FF80AB" />
  <circle cx="200" cy="165" r="4" fill="#FFF9C4" />
  <circle cx="178" cy="168" r="7" fill="#F48FB1" />
  <circle cx="222" cy="168" r="7" fill="#F48FB1" />

  <!-- Sparkles & Stars -->
  <path d="M 120,130 L 123,138 L 131,141 L 123,144 L 120,152 L 117,144 L 109,141 L 117,138 Z" fill="#FFD700" opacity="0.85" />
  <path d="M 285,270 L 288,276 L 294,279 L 288,282 L 285,288 L 282,282 L 276,279 L 282,276 Z" fill="#FFD700" opacity="0.85" />
  <circle cx="100" cy="270" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="300" cy="150" r="4" fill="#FFFFFF" opacity="0.8" />

  <!-- Calligraphy Label -->
  <text x="200" y="470" font-family="'Playfair Display', serif" font-size="22" font-weight="bold" fill="#880E4F" text-anchor="middle" letter-spacing="2">
    Wang Yi ✨
  </text>
</svg>
